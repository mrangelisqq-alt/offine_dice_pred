<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visionary - Color Probability & History</title>
<style>
  body { background: #0f1117; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; min-height: 100vh; margin: 0; }
  h1 { color: #00d4ff; font-size: 24px; margin-bottom: 20px; letter-spacing: 1px; }
  
  .card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; padding: 20px; width: 100%; max-width: 600px; box-sizing: border-box; margin-bottom: 20px; }
  .card-title { font-size: 14px; color: #888; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }

  /* Кнопки выбора цвета */
  .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
  .btn-color { padding: 12px; border: 2px solid transparent; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; color: #fff; background: #222533; }
  .btn-color:hover { opacity: 0.85; transform: translateY(-2px); }
  
  .btn-red { background: #ff4d4d; }
  .btn-orange { background: #ffa500; color: #111; }
  .btn-yellow { background: #ffff00; color: #111; }
  .btn-green { background: #2ecc71; color: #111; }
  .btn-blue { background: #3498db; }
  .btn-purple { background: #9b59b6; }

  /* Панель управления */
  .controls { display: flex; gap: 10px; }
  .btn-action { flex: 1; padding: 10px; border: 1px solid #2a2d3a; border-radius: 8px; background: #222533; color: #aaa; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .btn-action:hover { background: #2a2d3a; color: #fff; }

  /* Статистика и шансы */
  .stats-list { display: flex; flex-direction: column; gap: 12px; }
  .stat-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stat-label { width: 70px; font-weight: bold; font-size: 13px; }
  .progress-bar-bg { flex: 1; height: 10px; background: #0f1117; border-radius: 5px; overflow: hidden; border: 1px solid #2a2d3a; }
  .progress-bar-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
  .stat-val { width: 90px; text-align: right; font-family: monospace; font-size: 13px; color: #00d4ff; }

  /* История */
  #historyLog { max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  .history-item { display: flex; justify-content: space-between; padding: 6px 10px; background: #0f1117; border-radius: 6px; border-left: 4px solid #555; }
</style>
</head>
<body>

<h1>visionary analytics</h1>

<!-- Выбор цветов -->
<div class="card">
  <div class="card-title">Добавить результат</div>
  <div class="color-grid">
    <button class="btn-color btn-red" onclick="addRoll('Red')">Red</button>
    <button class="btn-color btn-orange" onclick="addRoll('Orange')">Orange</button>
    <button class="btn-color btn-yellow" onclick="addRoll('Yellow')">Yellow</button>
    <button class="btn-color btn-green" onclick="addRoll('Green')">Green</button>
    <button class="btn-color btn-blue" onclick="addRoll('Blue')">Blue</button>
    <button class="btn-color btn-purple" onclick="addRoll('Purple')">Purple</button>
  </div>
  <div class="controls">
    <button class="btn-action" onclick="undoLast()">Undo Last</button>
    <button class="btn-action" onclick="clearAll()">Reset All</button>
  </div>
</div>

<!-- Статистика -->
<div class="card">
  <div class="card-title">Шансы и Статистика (Всего: <span id="totalCount">0</span>)</div>
  <div class="stats-list" id="statsList"></div>
</div>

<!-- История -->
<div class="card">
  <div class="card-title">История бросков</div>
  <div id="historyLog">
    <div style="color: #555;">История пуста</div>
  </div>
</div>

<script>
const COLORS = ['Red', 'Orange', 'Yellow', 'Green', 'Blue', 'Purple'];
const COLOR_HEX = {
  Red: '#ff4d4d',
  Orange: '#ffa500',
  Yellow: '#ffff00',
  Green: '#2ecc71',
  Blue: '#3498db',
  Purple: '#9b59b6'
};

let history = [];

function addRoll(color) {
  history.push({ color, time: new Date().toLocaleTimeString() });
  updateUI();
}

function undoLast() {
  if (history.length > 0) {
    history.pop();
    updateUI();
  }
}

function clearAll() {
  if (confirm('Очистить всю историю?')) {
    history = [];
    updateUI();
  }
}

function updateUI() {
  const total = history.length;
  document.getElementById('totalCount').textContent = total;

  // Подсчет количества каждого цвета
  const counts = { Red: 0, Orange: 0, Yellow: 0, Green: 0, Blue: 0, Purple: 0 };
  history.forEach(item => counts[item.color]++);

  // Отрисовка статистики
  const statsContainer = document.getElementById('statsList');
  statsContainer.innerHTML = '';

  COLORS.forEach(color => {
    const count = counts[color];
    const percent = total > 0 ? ((count / total) * 100).toFixed(1) : 0;

    const row = document.createElement('div');
    row.className = 'stat-item';
    row.innerHTML = `
      <div class="stat-label" style="color: ${COLOR_HEX[color]}">${color}</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: ${percent}%; background: ${COLOR_HEX[color]}"></div>
      </div>
      <div class="stat-val">${percent}% (${count})</div>
    `;
    statsContainer.appendChild(row);
  });

  // Отрисовка истории
  const historyContainer = document.getElementById('historyLog');
  if (total === 0) {
    historyContainer.innerHTML = '<div style="color: #555;">История пуста</div>';
    return;
  }

  historyContainer.innerHTML = '';
  // Показываем последние броски вверху
  [...history].reverse().forEach((item, index) => {
    const el = document.createElement('div');
    el.className = 'history-item';
    el.style.borderLeftColor = COLOR_HEX[item.color];
    el.innerHTML = `
      <span style="color: ${COLOR_HEX[item.color]}; font-weight: bold;">${item.color}</span>
      <span style="color: #666;">#${total - index} — ${item.time}</span>
    `;
    historyContainer.appendChild(el);
  });
}

// Инициализация пустой статистики при загрузке
updateUI();
</script>
</body>
</html>
